<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rathan Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<meta name="description" content="Interactive, editable dashboard CV for Rathan Narayana Raju, Senior Data Analyst.">
<style>
/* ============================================================
   Interactive CV Dashboard — self-contained stylesheet
   ============================================================ */
:root{
  --navy-900:#050f2b; --navy-800:#0a1a3c; --navy-700:#102552;
  --blue:#2563eb; --blue-600:#1d5fe0; --blue-300:#60a5fa; --blue-100:#dbeafe;
  --teal:#14b8a6; --violet:#8b5cf6; --orange:#f97316; --amber:#f5b400;
  --page:#eef1f6; --card:#ffffff; --card-2:#f7f9fc;
  --ink:#0f1b33; --ink-soft:#475069; --ink-mute:#78829b;
  --line:#e4e9f2; --track:#e6ebf4;
  --shadow:0 1px 2px rgba(15,27,51,.05), 0 8px 24px -12px rgba(15,27,51,.18);
  --shadow-lg:0 12px 40px -16px rgba(15,27,51,.35);
  --r-lg:18px; --r-md:14px; --r-sm:10px;
  --side-w:320px;
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
}
html[data-theme="dark"]{
  --page:#060c1c; --card:#0e1730; --card-2:#121d3a;
  --ink:#eaf0fb; --ink-soft:#a8b4cf; --ink-mute:#7d8aa8;
  --line:#1e2b4d; --track:#1b2745;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -14px rgba(0,0,0,.7);
  --shadow-lg:0 18px 50px -20px rgba(0,0,0,.85);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
  --page:#060c1c; --card:#0e1730; --card-2:#121d3a;
  --ink:#eaf0fb; --ink-soft:#a8b4cf; --ink-mute:#7d8aa8;
  --line:#1e2b4d; --track:#1b2745;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -14px rgba(0,0,0,.7);
  --shadow-lg:0 18px 50px -20px rgba(0,0,0,.85);
  }
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
*{-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{
  background:var(--page); color:var(--ink); font-family:var(--font);
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
  padding:26px 20px 60px; transition:background .3s,color .3s;
}
h1,h2,h3,h4,p,ul{margin:0;padding:0}
ul{list-style:none}
[contenteditable]{outline:none}
::selection{background:rgba(37,99,235,.28)}

/* ---------- Toolbar ---------- */
.toolbar{
  position:sticky; top:14px; z-index:80; max-width:1520px; margin:0 auto 18px;
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  padding:10px 14px; border-radius:999px;
  background:color-mix(in srgb, var(--card) 88%, transparent);
  border:1px solid var(--line); box-shadow:var(--shadow);
  backdrop-filter:blur(14px);
}
.tb-brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:13px;letter-spacing:.02em;margin-right:auto}
.tb-dot{width:9px;height:9px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 4px rgba(37,99,235,.18)}
.btn{
  display:inline-flex;align-items:center;gap:7px;cursor:pointer;
  border:1px solid var(--line); background:var(--card-2); color:var(--ink-soft);
  font:600 12.5px/1 var(--font); padding:9px 13px; border-radius:999px;
  transition:.18s ease; white-space:nowrap;
}
.btn:hover{color:var(--ink); border-color:var(--blue); transform:translateY(-1px)}
.btn svg{width:15px;height:15px;flex:none}
.btn:focus-visible,.mini:focus-visible,.add-btn:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 6px 18px -8px var(--blue)}
.btn.primary:hover{background:var(--blue-600)}
.btn.on{background:var(--teal);border-color:var(--teal);color:#04231f;box-shadow:0 6px 18px -8px var(--teal)}
.btn.danger:hover{border-color:#ef4444;color:#ef4444}
.save-pill{font-size:11.5px;color:var(--ink-mute);opacity:0;transition:opacity .3s;font-weight:600}
.save-pill.show{opacity:1}

/* ---------- Shell ---------- */
.sheet{
  max-width:1520px;margin:0 auto;background:var(--card);border-radius:26px;
  box-shadow:var(--shadow-lg); border:1px solid var(--line);
  display:grid; grid-template-columns:var(--side-w) 1fr; overflow:hidden;
}
/* ---------- Sidebar ---------- */
.side{
  background:linear-gradient(165deg,var(--navy-800) 0%,var(--navy-900) 55%,#02070f 100%);
  color:#dbe6ff; padding:30px 26px 34px; position:relative;
}
.side::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(520px 260px at 50% -8%,rgba(37,99,235,.30),transparent 70%)}
.side > *{position:relative;z-index:1}
.avatar-wrap{width:158px;height:158px;margin:4px auto 20px;position:relative}
.avatar{
  width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;
  border:4px solid var(--blue); box-shadow:0 0 0 7px rgba(37,99,235,.16), 0 14px 30px -12px #000;
  background:#0d1c3d;
}
.avatar-ph{display:grid;place-items:center;color:#4d6699;font-size:44px;font-weight:800;letter-spacing:.04em}
.avatar-edit{
  position:absolute;right:6px;bottom:6px;width:38px;height:38px;border-radius:50%;
  background:var(--blue);border:3px solid var(--navy-800);display:none;place-items:center;
  cursor:pointer;color:#fff;transition:.18s;
}
.avatar-edit:hover{transform:scale(1.08)}
.avatar-edit svg{width:16px;height:16px}
.side h1{font-size:26px;line-height:1.15;font-weight:800;text-align:center;letter-spacing:-.01em;color:#fff}
.side .role{text-align:center;color:var(--blue-300);font-weight:700;font-size:16px;margin-top:9px}
.side .tagline{text-align:center;color:#9fb2d8;font-size:12.5px;margin-top:5px}
.side-meta{margin-top:18px;display:grid;gap:9px}
.meta-row{display:flex;align-items:center;gap:10px;font-size:12.5px;color:#c3d2ee}
.meta-row svg{width:15px;height:15px;flex:none;color:var(--blue-300)}
.side-sep{height:1px;background:linear-gradient(90deg,transparent,rgba(120,160,230,.35),transparent);margin:24px 0 20px}
.side-h{
  color:var(--blue-300);font-size:12.5px;font-weight:800;letter-spacing:.14em;
  text-transform:uppercase;margin-bottom:14px;display:flex;align-items:center;gap:8px;min-height:24px;
}
.contact-list{display:grid;gap:13px}
.contact-item{display:flex;align-items:center;gap:12px;font-size:13px;color:#d7e3f9;word-break:break-word}
.contact-ic{
  width:30px;height:30px;border-radius:9px;background:rgba(96,165,250,.12);
  display:grid;place-items:center;flex:none;color:var(--blue-300);border:1px solid rgba(96,165,250,.18);
}
.contact-ic svg{width:15px;height:15px}
.contact-item a{color:inherit;text-decoration:none;border-bottom:1px solid transparent;transition:.15s}
.contact-item a:hover{color:#fff;border-color:var(--blue-300)}
.bullet-list{display:grid;gap:11px}
.bullet-item{display:flex;gap:10px;font-size:13px;color:#d7e3f9;align-items:flex-start}
.bullet-item::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--blue-300);margin-top:7px;flex:none}
.edu-item{display:flex;gap:12px;align-items:flex-start}
.edu-ic{width:36px;height:36px;border-radius:11px;background:rgba(96,165,250,.14);display:grid;place-items:center;color:var(--blue-300);flex:none}
.edu-ic svg{width:19px;height:19px}
.edu-item b{display:block;color:#fff;font-size:13.5px;font-weight:700}
.edu-item span[data-bind]{display:block;color:#a9bbdd;font-size:12.5px}

/* ---------- Main ---------- */
.main{padding:22px;display:grid;gap:16px;background:var(--card);align-content:start}
.card{
  background:var(--card-2);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:18px; box-shadow:var(--shadow); position:relative;
  transition:transform .25s cubic-bezier(.2,.7,.3,1), box-shadow .25s, border-color .25s;
}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:color-mix(in srgb,var(--blue) 35%,var(--line))}
.card-h{
  display:flex;align-items:center;gap:10px;font-size:13px;font-weight:800;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink);margin-bottom:16px;min-height:24px;
}
.card-h .hi{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--blue);color:#fff;flex:none}
.card-h .hi svg{width:17px;height:17px}

/* rows */
.row-stats{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.row-2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2.05fr);gap:16px}
.row-3{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(0,0.94fr) minmax(0,1.02fr);gap:16px}
.row-4{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(0,1fr) minmax(0,1fr);gap:16px}

/* stat cards */
.stat{display:flex;align-items:center;gap:14px;padding:16px 16px}
.stat .ic{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none;
  box-shadow:0 8px 18px -10px currentColor}
.stat .ic svg{width:24px;height:24px}
.stat .v{font-size:30px;font-weight:800;line-height:1;letter-spacing:-.02em;color:var(--ink)}
.stat .l{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-mute);margin-top:6px;max-width:15ch}

/* summary */
.summary-text{font-size:13.4px;line-height:1.72;color:var(--ink-soft)}

/* expertise */
.exp-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.exp{text-align:center;padding:6px 4px;border-radius:var(--r-md);transition:background .2s}
.exp:hover{background:color-mix(in srgb,var(--blue) 7%,transparent)}
.exp .ic{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;margin:0 auto 12px;color:#fff;
  transition:transform .3s cubic-bezier(.2,.8,.3,1.4)}
.exp:hover .ic{transform:translateY(-4px) rotate(-4deg)}
.exp .ic svg{width:28px;height:28px}
.exp b{display:block;font-size:11.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--ink);line-height:1.35}
.exp p{font-size:11.8px;color:var(--ink-mute);margin-top:8px;line-height:1.55}

/* timeline */
.tl{position:relative;padding:6px 4px 2px}
.tl-track{position:relative;height:34px;margin:0 0 14px}
.tl-line{position:absolute;left:6%;right:6%;top:22px;height:3px;border-radius:3px;
  background:linear-gradient(90deg,var(--blue),var(--teal),var(--violet))}
.tl-cols{display:grid;position:relative}
.tl-year{font-size:13px;font-weight:800;color:var(--ink-soft);text-align:center}
.tl-dot{width:15px;height:15px;border-radius:50%;margin:6px auto 0;border:3px solid var(--card-2);
  position:relative;z-index:2;cursor:pointer;transition:transform .2s}
.tl-dot:hover{transform:scale(1.35)}
.tl-body{display:grid;gap:14px}
.tl-col{padding-right:9px}
.tl-co{font-size:14.5px;font-weight:800;line-height:1.25;min-height:2.5em}
.tl-role{font-size:12.8px;color:var(--ink-soft);margin-top:5px;font-weight:600;min-height:3em}
.tl-ul{margin-top:11px;display:grid;gap:7px}
.tl-ul li{font-size:12.2px;color:var(--ink-mute);display:flex;gap:8px;align-items:flex-start;line-height:1.45}
.tl-ul li::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor;margin-top:6px;flex:none;opacity:.7}

/* bars */
.bars{display:grid;gap:11px}
.bar-row{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1.5fr);align-items:center;gap:11px}
.bar-name{font-size:12px;font-weight:600;color:var(--ink-soft)}
.bar{position:relative;height:9px;border-radius:99px;background:var(--track);overflow:hidden}
.bar-fill{position:absolute;inset:0 auto 0 0;border-radius:99px;width:0;
  background:linear-gradient(90deg,var(--blue-300),var(--blue));transition:width .9s cubic-bezier(.2,.8,.2,1)}
.bar-val{position:absolute;right:0;top:-19px;font-size:11px;font-weight:700;color:var(--blue);opacity:0;transition:opacity .2s}
.bar-row:hover .bar-val{opacity:1}

/* industry bars */
.ind{display:grid;gap:14px}
.ind-row .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px}
.ind-row .nm{font-size:12.6px;font-weight:600;color:var(--ink-soft)}
.ind-row .pc{font-size:12.6px;font-weight:800;color:var(--ink)}

/* donut */
.donut-wrap{position:relative;width:100%;max-width:330px;margin:2px auto 0;aspect-ratio:1}
.donut{position:absolute;left:27.5%;top:27.5%;width:45%;height:45%;transform:rotate(-90deg);overflow:visible}
.donut circle{transition:stroke-width .22s ease, opacity .22s ease;cursor:pointer}
.donut circle.dim{opacity:.32}
.donut-mid{
  position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none;
}
.donut-mid .ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;margin:0 auto;
  background:color-mix(in srgb,var(--amber) 18%,transparent);color:var(--amber)}
.donut-mid .ic svg{width:24px;height:24px}
.donut-mid .pv{font-size:22px;font-weight:800;line-height:1.1}
.donut-mid .pl{font-size:10.5px;color:var(--ink-mute);max-width:12ch;margin:3px auto 0;line-height:1.3}
.dlab{position:absolute;width:78px;font-size:10.2px;line-height:1.35;color:var(--ink-mute);transform:translate(-50%,-50%);pointer-events:none}
.dlab b{display:block;font-size:14px;font-weight:800;color:var(--ink);margin-bottom:2px}

/* projects */
.proj-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.proj{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:14px;
  display:flex;flex-direction:column;gap:10px;transition:.25s}
.proj:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--blue) 45%,var(--line));box-shadow:var(--shadow)}
.proj .head{display:flex;gap:11px;align-items:flex-start}
.proj .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:#fff;flex:none}
.proj .ic svg{width:21px;height:21px}
.proj .t{font-size:12.8px;font-weight:800;line-height:1.3}
.proj .tags{font-size:10.6px;color:var(--ink-mute);margin-top:5px;font-weight:600}
.proj p{font-size:12px;color:var(--ink-soft);line-height:1.6}

/* impact */
.imp{display:grid;gap:16px}
.imp-row{display:flex;align-items:center;gap:14px}
.imp-ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none}
.imp-ic svg{width:23px;height:23px}
.imp .v{font-size:27px;font-weight:800;line-height:1;letter-spacing:-.02em}
.imp .l{font-size:11.6px;color:var(--ink-mute);line-height:1.4;max-width:20ch}

/* footer */
.foot{
  position:relative;
  grid-column:1/-1;display:flex;align-items:center;gap:22px;flex-wrap:wrap;
  padding:16px 52px 16px 26px;border-top:1px solid var(--line);
  background:linear-gradient(90deg,color-mix(in srgb,var(--blue) 8%,var(--card)),var(--card));
}
.quote{display:flex;gap:11px;align-items:flex-start;font-size:13.2px;font-style:italic;color:var(--ink-soft);margin-right:auto;max-width:56ch}
.quote svg{width:22px;height:22px;color:var(--blue);flex:none;margin-top:-2px}
.traits{display:flex;gap:24px;flex-wrap:wrap}
.trait{display:flex;align-items:center;gap:9px;font-size:12.4px;font-weight:600;color:var(--ink-soft)}
.trait svg{width:19px;height:19px;color:var(--blue)}

/* ---------- Inline editing ----------
   The page is always editable. Every control stays hidden until the pointer
   (or keyboard focus) reaches the thing it belongs to, and each one floats
   over the layout rather than pushing it around. */
body.live [data-bind]{overflow-wrap:normal;word-break:normal;border-radius:5px;
  transition:box-shadow .15s, background .15s}
.contact-item [data-bind],.href-edit{overflow-wrap:break-word!important;word-break:break-word!important}
body.live [data-bind]:hover{background:color-mix(in srgb,var(--blue) 8%,transparent);
  box-shadow:0 0 0 1px color-mix(in srgb,var(--blue) 30%,transparent)}
body.live [data-bind]:focus{background:color-mix(in srgb,var(--blue) 12%,transparent);
  box-shadow:0 0 0 2px var(--blue)}
.side [data-bind]:hover,.side [data-bind]:focus{background:rgba(96,165,250,.16)!important}
body.live [data-act="icon"]{cursor:pointer;transition:transform .15s}
body.live [data-act="icon"]:hover{transform:scale(1.09);
  outline:2px dashed color-mix(in srgb,var(--blue) 55%,transparent);outline-offset:3px;border-radius:50%}
body.live .bar:hover{cursor:ew-resize;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--blue) 55%,transparent)}
body.live .card:hover,body.live .card:focus-within{z-index:30}

/* hidden by default */
.ctl,.swatches,.edit-only,.avatar-edit,.add-mini,.skill-edit{display:none}

/* …revealed for whatever is under the pointer */
body.live .item-wrap:hover .ctl,
body.live .item-wrap:focus-within .ctl{display:inline-flex}
body.live .item-wrap:hover .swatches,
body.live .item-wrap:focus-within .swatches{display:flex}
body.live .contact-item:hover .edit-only,
body.live .contact-item:focus-within .edit-only{display:block}
body.live .avatar-wrap:hover .avatar-edit,
body.live .avatar-wrap:focus-within .avatar-edit{display:grid}
body.live .card:hover > .skill-edit,
body.live .card:focus-within > .skill-edit{display:block}
body.live .card:hover > .card-h > .add-mini,
body.live .card:focus-within > .card-h > .add-mini,
body.live .side:hover .side-h > .add-mini,
body.live .side:focus-within .side-h > .add-mini,
body.live .row-rel:hover > .add-mini,
body.live .row-rel:focus-within > .add-mini,
body.live .foot:hover > .add-mini,
body.live .foot:focus-within > .add-mini{display:grid}

.ctl{gap:6px;align-items:center}
.mini{
  width:22px;height:22px;border-radius:7px;display:grid;place-items:center;cursor:pointer;
  border:1px solid var(--line);background:var(--card);color:var(--ink-mute);transition:.15s;flex:none;
}
.mini:hover{color:#fff;background:var(--blue);border-color:var(--blue)}
.mini.del:hover{background:#ef4444;border-color:#ef4444}
.mini svg{width:12px;height:12px}
.side .mini{background:#16244a;border-color:rgba(255,255,255,.16);color:#9fb2d8}
.item-wrap{position:relative}
.item-ctl{position:absolute;top:-6px;right:-4px;z-index:5}

/* the “add another” button lives in the section heading, so nothing reflows */
.add-mini{
  width:23px;height:23px;border-radius:50%;place-items:center;cursor:pointer;flex:none;margin-left:auto;
  border:1px dashed color-mix(in srgb,var(--blue) 60%,var(--line));background:var(--card);
  color:var(--blue);transition:.15s;
}
.add-mini:hover{background:var(--blue);border-style:solid;color:#fff;transform:scale(1.08)}
.add-mini svg{width:12px;height:12px}
.side .add-mini{background:#16244a;color:var(--blue-300);border-color:rgba(96,165,250,.5)}
.add-mini.float{position:absolute;z-index:9}
.row-rel{position:relative}
.row-rel > .add-mini.float{top:-11px;right:-5px}
.foot > .add-mini.float{top:50%;right:16px;transform:translateY(-50%)}

/* colour picker floats over the item it recolours */
.swatches .add-mini{display:grid;margin:0 3px 0 0;width:20px;height:20px;border-color:color-mix(in srgb,var(--blue) 45%,var(--line))}
.swatches{
  position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);z-index:8;gap:4px;
  flex-wrap:wrap;justify-content:center;width:max-content;max-width:min(230px,calc(100vw - 48px));
  padding:5px 8px;border-radius:99px;
  background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow-lg);
}
.side .swatches{background:#16244a;border-color:rgba(255,255,255,.16)}
.sw{width:13px;height:13px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:.15s}
.sw:hover{transform:scale(1.25)}
.sw.sel{border-color:var(--ink)}

/* contact links: the address sits under the label while you are on it */
.contact-item .edit-only{
  position:absolute;left:42px;right:0;top:100%;z-index:9;margin-top:2px;
  background:#16244a;border:1px solid rgba(120,160,230,.32);border-radius:8px;padding:5px 8px;
}

/* skill weights drop out of the bottom of their card */
.skill-edit{
  position:absolute;left:12px;right:12px;top:100%;margin-top:-8px;z-index:25;
  background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 14px 6px;
  box-shadow:var(--shadow-lg);
}
.skill-edit .bar-row{margin-bottom:18px}
.skill-edit .swatches{bottom:-11px}

/* ---------- Modal ---------- */
.overlay{
  position:fixed;inset:0;background:rgba(3,8,20,.62);backdrop-filter:blur(5px);
  display:none;place-items:center;z-index:200;padding:22px;
}
.overlay.open{display:grid}
.modal{
  width:min(680px,100%);max-height:86vh;overflow:auto;background:var(--card);
  border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow-lg);padding:22px;
}
.modal h3{font-size:16px;font-weight:800;margin-bottom:6px}
.modal .sub{font-size:12.5px;color:var(--ink-mute);margin-bottom:14px;line-height:1.6}
.modal textarea{
  width:100%;min-height:260px;resize:vertical;border-radius:12px;border:1px solid var(--line);
  background:var(--card-2);color:var(--ink);font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;padding:12px;
}
.modal textarea:focus{outline:none;border-color:var(--blue)}
.modal-foot{display:flex;gap:9px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.help-list{display:grid;gap:10px;font-size:13px;color:var(--ink-soft)}
.help-list b{color:var(--ink)}
.kbd{display:inline-block;padding:2px 7px;border-radius:6px;border:1px solid var(--line);
  background:var(--card-2);font:600 11px/1.5 ui-monospace,Menlo,monospace;color:var(--ink)}
.toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);z-index:300;
  background:var(--ink);color:var(--card);font:600 12.5px/1 var(--font);padding:12px 18px;border-radius:999px;
  opacity:0;pointer-events:none;transition:.28s cubic-bezier(.2,.8,.2,1);box-shadow:var(--shadow-lg);
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- Reveal ---------- */
.reveal{opacity:0;transform:translateY(14px)}
.reveal.in{opacity:1;transform:none;transition:opacity .55s ease,transform .55s cubic-bezier(.2,.8,.2,1)}

/* ---------- Responsive ---------- */
@media (max-width:1240px){
  .row-3,.row-4{grid-template-columns:1fr 1fr}
  .row-3 > :nth-child(1),.row-4 > :nth-child(1){grid-column:1/-1}
  .row-stats{grid-template-columns:repeat(3,1fr)}
}
@media (max-width:980px){
  .sheet{grid-template-columns:1fr}
  .row-2,.row-3,.row-4{grid-template-columns:1fr}
  .row-2 > *,.row-3 > *,.row-4 > *{grid-column:auto!important}
  .exp-grid{grid-template-columns:repeat(3,1fr)}
  .proj-grid{grid-template-columns:1fr}
  .side{padding-bottom:26px}
}
@media (max-width:600px){
  body{padding:14px 10px 44px}
  .row-stats,.exp-grid{grid-template-columns:repeat(2,1fr)}
  .tl-cols,.tl-body{grid-template-columns:1fr!important}
  .tl-track{display:none}
  .toolbar{border-radius:18px}
  .tb-brand span{display:none}
}

/* ---------- Print ---------- */
/* Locked desktop layout — used while measuring and while printing, so the
   sheet keeps its dashboard grid no matter how narrow the paper or window is. */
.pg-fixed{width:1520px!important;max-width:none!important;grid-template-columns:var(--side-w) 1fr!important}
.pg-fixed .row-stats{grid-template-columns:repeat(5,1fr)!important}
.pg-fixed .row-2{grid-template-columns:minmax(0,1fr) minmax(0,2.05fr)!important}
.pg-fixed .row-3{grid-template-columns:minmax(0,1.8fr) minmax(0,0.94fr) minmax(0,1.02fr)!important}
.pg-fixed .row-4{grid-template-columns:minmax(0,1.75fr) minmax(0,1fr) minmax(0,1fr)!important}
.pg-fixed .row-2 > *,.pg-fixed .row-3 > *,.pg-fixed .row-4 > *{grid-column:auto!important}
.pg-fixed .exp-grid{grid-template-columns:repeat(5,1fr)!important}
.pg-fixed .proj-grid{grid-template-columns:repeat(3,1fr)!important}
.pg-fixed .tl-track{display:block!important}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}
}

@media print{
  @page{margin:0}                 /* the exact page size is injected before printing */
  body{padding:16px;background:#fff}
  .toolbar,.overlay,.toast,.ctl,.swatches,.avatar-edit,.add-mini,.edit-only,.skill-edit{display:none!important}
  .sheet{box-shadow:none;border-radius:18px}
  .card{break-inside:avoid;box-shadow:none}
  .reveal{opacity:1!important;transform:none!important}
  .card:hover{transform:none}
}
</style>

/* ============================================================
   5. Persistence
   ============================================================ */
let saveTimer = null;
function save(quiet){
  try{
    localStorage.setItem(KEY, JSON.stringify(DATA));
    if(!quiet) flashSaved();
  }catch(e){ toast('Could not save locally — export your JSON to keep a copy.'); }
}
function scheduleSave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>save(), 500);
}
function flashSaved(){
  const p = document.getElementById('savePill');
  p.textContent = 'Saved'; p.classList.add('show');
  clearTimeout(flashSaved._t);
  flashSaved._t = setTimeout(()=>p.classList.remove('show'), 1400);
}
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){
      const saved = JSON.parse(raw);
      DATA = (saved && saved.dataVersion === DEFAULT_DATA.dataVersion)
        ? mergeDefaults(saved)
        : clone(DEFAULT_DATA);
    }
  }catch(e){ DATA = clone(DEFAULT_DATA); }
}
/* keep newly added default keys if the saved copy is older */
function mergeDefaults(saved){
  const out = clone(DEFAULT_DATA);
  Object.keys(out).forEach(k=>{ if(saved[k] !== undefined) out[k] = saved[k]; });
  out.profile = Object.assign(clone(DEFAULT_DATA.profile), saved.profile||{});
  return out;
}

const CE_MODE = (()=>{ const d = document.createElement('div');
  d.setAttribute('contenteditable','plaintext-only');
  return d.contentEditable === 'plaintext-only' ? 'plaintext-only' : 'true'; })();
function applyEditable(){
  document.querySelectorAll('[data-bind]').forEach(el=>{
    if(editing){ el.setAttribute('contenteditable', CE_MODE); el.setAttribute('spellcheck','false'); }
    else el.removeAttribute('contenteditable');
  });
}
function setEditing(on){
  editing = on;
  document.body.classList.toggle('live', on);
  applyEditable();
  try{ localStorage.setItem(KEY+':locked', on ? '' : '1'); }catch(e){}
  toast(on ? 'Editing unlocked — click any text to change it.'
           : 'Editing locked. Press Ctrl/Cmd + E to unlock.');
  if(!on) save();
}

  education:     ()=>({degree:'Degree', school:'Institution', years:'20XX – 20XX'}),

document.addEventListener('click', e=>{
  const t = e.target.closest('[data-act]');
  if(!t) return;
  const act = t.getAttribute('data-act');

  if(act==='del'){
    if(!editing) return;
    const arr = get(t.getAttribute('data-list'));
    arr.splice(+t.getAttribute('data-i'), 1);
    save(true); render(); return;
  }
  if(act==='add'){
    if(!editing) return;
    const path = t.getAttribute('data-list');
    const key = path.split('.').pop();
    const arr = get(path);
    arr.push(NEW_ITEM[key] ? NEW_ITEM[key]() : 'New item');
    save(true); render();
    const wrap = document.querySelector('[data-list="'+path+'"]');
    if(wrap) wrap.scrollIntoView({behavior:'smooth', block:'center'});
    return;
  }
  if(act==='color'){
    if(!editing) return;
    set(t.getAttribute('data-path'), t.getAttribute('data-color'));
    save(true); render(); return;
  }
  if(act==='icon'){
    if(!editing) return;
    const p = t.getAttribute('data-path');
    const cur = ICON_ORDER.indexOf(get(p));
    set(p, ICON_ORDER[(cur+1) % ICON_ORDER.length]);
    save(true); render(); return;
  }
  if(act==='photo'){ document.getElementById('photoInput').click(); return; }
});

/* photo upload — downscaled so it fits comfortably in local storage */
document.getElementById('photoInput').addEventListener('change', e=>{
  const f = e.target.files && e.target.files[0];
  if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{
    const img = new Image();
    img.onload = ()=>{
      const S = 460, c = document.createElement('canvas');
      const side = Math.min(img.width, img.height);
      c.width = c.height = S;
      const ctx = c.getContext('2d');
      ctx.drawImage(img, (img.width-side)/2, (img.height-side)/2, side, side, 0, 0, S, S);
      DATA.profile.photo = c.toDataURL('image/jpeg', 0.86);
      save(true); render(); toast('Photo updated');
    };
    img.src = r.result;
  };
  r.readAsDataURL(f);
  e.target.value = '';
});

/* ============================================================
   8. Bars — drag to set a value in edit mode
   ============================================================ */
function fillBars(){
  document.querySelectorAll('.bar-fill[data-w]').forEach(f=>{ f.style.width = f.getAttribute('data-w')+'%'; });
}
function barUpdate(bar, clientX){
  const path = bar.getAttribute('data-path');
  const max  = +(bar.getAttribute('data-max') || 100);
  const r = bar.getBoundingClientRect();
  const pct = Math.max(0, Math.min(1, (clientX - r.left) / r.width));
  const val = Math.round(pct * max);
  set(path, val);
  const fill = bar.querySelector('.bar-fill');
  fill.style.transition = 'none';
  fill.style.width = (val/max*100)+'%';
  fill.setAttribute('data-w', val/max*100);
  const lab = bar.querySelector('.bar-val');
  if(lab) lab.textContent = (max===100 ? val+'%' : val);
  const pc = bar.closest('.ind-row') && bar.closest('.ind-row').querySelector('.pc');
  if(pc) pc.textContent = val+'%';
  scheduleSave();
}
let dragBar = null;
document.addEventListener('pointerdown', e=>{
  if(!editing) return;
  const bar = e.target.closest('.bar');
  if(!bar) return;
  dragBar = bar; bar.setPointerCapture(e.pointerId);
  barUpdate(bar, e.clientX); e.preventDefault();
});
document.addEventListener('pointermove', e=>{ if(dragBar) barUpdate(dragBar, e.clientX); });
document.addEventListener('pointerup', ()=>{
  if(!dragBar) return;
  const wasSkill = dragBar.getAttribute('data-path').startsWith('skills.');
  dragBar = null; save(true);
  if(wasSkill) render();
});

   9. Donut interaction + label placement
   ============================================================ */
function placeDonutLabels(){
  const wrap = document.getElementById('donutWrap');
  if(!wrap) return;
  const C = 2*Math.PI*52;
  wrap.querySelectorAll('.dlab').forEach(lab=>{
    const i = lab.getAttribute('data-lab');
    const seg = wrap.querySelector('[data-seg="'+i+'"]');
    if(!seg) return;
    const a = (+seg.getAttribute('data-mid') / C) * 2*Math.PI - Math.PI/2;
    const x = 50 + Math.cos(a)*38.5, y = 50 + Math.sin(a)*38.5;
    lab.style.left = x+'%';
    lab.style.top  = y+'%';
    lab.style.textAlign = Math.cos(a) > .25 ? 'left' : (Math.cos(a) < -.25 ? 'right' : 'center');
  });
}
function wireDonut(){
  const wrap = document.getElementById('donutWrap');
  if(!wrap) return;
  const mid = document.getElementById('donutMid');
  const total = DATA.skills.reduce((a,s)=>a+(+s.value||0),0) || 1;
  const base = mid.innerHTML;
  wrap.querySelectorAll('[data-seg]').forEach(seg=>{
    seg.addEventListener('mouseenter', ()=>{
      const s = DATA.skills[+seg.getAttribute('data-seg')];
      wrap.querySelectorAll('[data-seg]').forEach(o=>o.classList.toggle('dim', o!==seg));
      seg.setAttribute('stroke-width','26');
      mid.innerHTML = '<div class="pv" style="color:'+esc(s.color)+'">'+Math.round(s.value/total*100)+'%</div>'+
                      '<div class="pl">'+esc(s.label)+'</div>';
    });
    seg.addEventListener('mouseleave', ()=>{
      wrap.querySelectorAll('[data-seg]').forEach(o=>{ o.classList.remove('dim'); o.setAttribute('stroke-width','21'); });
      mid.innerHTML = base;
    });
  });
}

/* ============================================================
   10. Reveal + count-up
   ============================================================ */
let io = null;
function countUp(el){
  const raw = el.textContent.trim();
  const m = raw.match(/^(\D*)(\d[\d,.]*)(.*)$/);
  if(!m) return;
  const target = parseFloat(m[2].replace(/,/g,''));
  if(!isFinite(target) || target === 0) return;
  const dur = 850, t0 = performance.now();
  const step = now=>{
    if(document.activeElement === el){ el.textContent = raw; return; }
    const k = Math.min(1, (now-t0)/dur);
    const e = 1 - Math.pow(1-k, 3);
    el.textContent = m[1] + Math.round(target*e).toLocaleString() + m[3];
    if(k < 1) requestAnimationFrame(step); else el.textContent = raw;
  };
  requestAnimationFrame(step);
}
function observeReveal(){
  if(io) io.disconnect();
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const items = document.querySelectorAll('.reveal');
  if(reduce){ items.forEach(el=>el.classList.add('in')); return; }
  io = new IntersectionObserver(entries=>{
    entries.forEach((en,n)=>{
      if(!en.isIntersecting) return;
      const el = en.target;
      setTimeout(()=>{
        el.classList.add('in');
        el.querySelectorAll('[data-count]').forEach(countUp);
      }, n*55);
      io.unobserve(el);
    });
  }, {threshold:.12, rootMargin:'0px 0px -40px 0px'});
  items.forEach(el=>io.observe(el));
}
setTimeout(()=>document.querySelectorAll('.reveal').forEach(el=>el.classList.add('in')), 2500);
window.addEventListener('resize', ()=>placeDonutLabels());

}
const overlay = document.getElementById('overlay');
const modal   = document.getElementById('modal');
function openModal(html){ modal.innerHTML = html; overlay.classList.add('open'); }
function closeModal(){ overlay.classList.remove('open'); modal.innerHTML=''; }
overlay.addEventListener('click', e=>{ if(e.target===overlay) closeModal(); });
document.addEventListener('click', e=>{ if(e.target.closest('[data-close]')) closeModal(); });

const inIframe = (()=>{ try{ return window.self !== window.top; }catch(e){ return true; } })();

function copyText(str){
  const done = ()=>toast('Copied to clipboard');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(str).then(done).catch(()=>legacyCopy(str,done));
  } else legacyCopy(str, done);
}
function legacyCopy(str, done){
  const ta = document.createElement('textarea');
  ta.value = str; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); done(); }
  catch(e){ toast('Select the text and copy it manually'); }
  document.body.removeChild(ta);
}

/* --- Export --- */
document.getElementById('btnExport').addEventListener('click', ()=>{
  const json = JSON.stringify(DATA, null, 2);
  openModal(
    '<h3>Export your CV data</h3>'+
    '<p class="sub">This JSON holds everything on the page. Keep it somewhere safe — pasting it back through <b>Import</b> restores your CV on any browser or device.</p>'+
    '<textarea id="expArea" readonly>'+esc(json)+'</textarea>'+
    '<div class="modal-foot">'+
      (inIframe ? '' : '<button class="btn" id="dlJson">'+svg('download')+'Download .json</button>')+
      '<button class="btn primary" id="copyJson">'+svg('copy')+'Copy JSON</button>'+
      '<button class="btn" data-close>Close</button>'+
    '</div>');
  document.getElementById('copyJson').addEventListener('click', ()=>copyText(json));
  const dl = document.getElementById('dlJson');
  if(dl) dl.addEventListener('click', ()=>{
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([json], {type:'application/json'}));
    a.download = 'cv-dashboard-data.json'; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
  });
});

/* --- Import --- */
document.getElementById('btnImport').addEventListener('click', ()=>{
  openModal(
    '<h3>Import CV data</h3>'+
    '<p class="sub">Paste a JSON export below and choose <b>Load data</b>. This replaces everything currently on the page.</p>'+
    '<textarea id="impArea" placeholder="Paste your exported JSON here…"></textarea>'+
    '<div class="modal-foot">'+
      '<button class="btn" data-close>Cancel</button>'+
      '<button class="btn primary" id="doImport">'+svg('upload')+'Load data</button>'+
    '</div>');
  document.getElementById('doImport').addEventListener('click', ()=>{
    try{
      const parsed = JSON.parse(document.getElementById('impArea').value);
      if(!parsed || typeof parsed !== 'object' || !parsed.profile) throw new Error('bad shape');
      DATA = mergeDefaults(parsed);
      DATA.dataVersion = DEFAULT_DATA.dataVersion;
      save(true); render(); closeModal(); toast('CV data imported');
    }catch(err){ toast('That does not look like a valid CV export'); }
  });
});

/* --- Reset --- */
document.getElementById('btnReset').addEventListener('click', ()=>{
  openModal(
    '<h3>Reset to the original CV?</h3>'+
    '<p class="sub">Every change you have made in this browser will be discarded and the dashboard returns to its starting content. Export first if you want to keep a copy.</p>'+
    '<div class="modal-foot">'+
      '<button class="btn" data-close>Keep my changes</button>'+
      '<button class="btn primary" id="doReset">'+svg('reset')+'Reset everything</button>'+
    '</div>');
  document.getElementById('doReset').addEventListener('click', ()=>{
    DATA = clone(DEFAULT_DATA);
    save(true); render(); closeModal(); toast('Reset to the original CV');
  });
});

/* --- Help --- */
document.getElementById('btnHelp').addEventListener('click', ()=>{
  openModal(
    '<h3>How to use this dashboard</h3>'+
    '<p class="sub">Everything on the page is yours to change — no build step, no server.</p>'+
    '<div class="help-list">'+
      '<div><b>Always editable</b> — click any text and type over it. There is no edit mode to turn on.</div>'+

      '<div><b>Bars</b> — drag any progress bar to set its percentage.</div>'+
      '<div><b>Colours</b> — hover an item and a row of coloured dots appears over it; click one to recolour it.</div>'+
      '<div><b>Icons</b> — click any icon to cycle through the icon set.</div>'+
      '<div><b>Photo</b> — click the camera button on the avatar to upload your own picture.</div>'+
      '<div><b>Add / remove</b> — hover a card and a <b>+</b> appears beside its heading; hover any single entry for its bin icon.</div>'+
      '<div><b>Skills donut</b> — hover a segment to inspect it; the weights panel drops out of the bottom of that card while your pointer is on it.</div>'+
      '<div><b>Saving</b> — changes save automatically in this browser. Use <b>Export</b> for a portable copy and <b>Import</b> to restore it elsewhere.</div>'+

    '</div>'+
    '<div class="modal-foot"><button class="btn primary" data-close>Got it</button></div>');

/* --- Print --- */
let pageStyle = null;
function lockPrintLayout(){
  const sheet = document.getElementById('sheet');
  sheet.classList.add('pg-fixed');
  const r = sheet.getBoundingClientRect();
  const W = Math.ceil(r.width) + 32, H = Math.ceil(r.height) + 34;
  if(!pageStyle){ pageStyle = document.createElement('style'); document.head.appendChild(pageStyle); }
  pageStyle.textContent = '@media print{@page{size:'+W+'px '+H+'px;margin:0}}';
}
function unlockPrintLayout(){
  document.getElementById('sheet').classList.remove('pg-fixed');
  if(pageStyle) pageStyle.textContent = '';
}
window.addEventListener('beforeprint', lockPrintLayout);
window.addEventListener('afterprint', unlockPrintLayout);
document.getElementById('btnPrint').addEventListener('click', ()=>{
  if(document.activeElement && document.activeElement.blur) document.activeElement.blur();
  document.querySelectorAll('.reveal').forEach(el=>el.classList.add('in'));
  lockPrintLayout();
  setTimeout(()=>{
    try{ window.print(); }
    catch(err){ toast('This view will not let the page open a print dialog — open it in its own tab and print from there.'); }
    setTimeout(unlockPrintLayout, 800);
  }, 140);
});

/* --- Theme --- */
function setTheme(mode){
  document.documentElement.setAttribute('data-theme', mode);
  try{ localStorage.setItem(KEY+':theme', mode); }catch(e){}
  document.getElementById('btnTheme').innerHTML =
    (mode==='dark' ? svg('sun')+'Light' : svg('moon')+'Dark');
}
document.getElementById('btnTheme').addEventListener('click', ()=>{
  setTheme(document.documentElement.getAttribute('data-theme')==='dark' ? 'light' : 'dark');
});


/* --- Keyboard --- */
document.addEventListener('keydown', e=>{
  const meta = e.ctrlKey || e.metaKey;
  if(meta && e.key.toLowerCase()==='e'){ e.preventDefault(); setEditing(!editing); }
  if(meta && e.key.toLowerCase()==='s'){ e.preventDefault(); save(); }
  if(e.key==='Escape'){
    if(overlay.classList.contains('open')) closeModal();
    else if(document.activeElement && document.activeElement.hasAttribute('data-bind')) document.activeElement.blur();
  }
});

/* ============================================================
   12. Boot
   ============================================================ */
(function init(){
  load();
  let theme = null;
  try{ theme = localStorage.getItem(KEY+':theme'); }catch(e){}
  if(!theme) theme = document.documentElement.getAttribute('data-theme') ||
    (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  setTheme(theme);
  let locked = false;
  try{ locked = localStorage.getItem(KEY+':locked')==='1'; }catch(e){}
  editing = !locked;
  document.body.classList.toggle('live', editing);
  document.getElementById('btnPrint').innerHTML  = svg('printer')+'PDF';
  document.getElementById('btnExport').innerHTML = svg('download')+'Export';
  document.getElementById('btnImport').innerHTML = svg('upload')+'Import';
  document.getElementById('btnReset').innerHTML  = svg('reset')+'Reset';
  document.getElementById('btnHelp').innerHTML   = svg('book')+'Help';
  render();
  try{
    if(!localStorage.getItem(KEY+':seen')){
      localStorage.setItem(KEY+':seen','1');
      setTimeout(()=>toast('Everything here is editable — click any text and type. Hover a card for its add, colour and delete controls.'), 900);
    }
  }catch(e){}
})();
</script>
